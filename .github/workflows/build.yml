name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: screwbot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Terbitkan APK sebagai Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ScrewBot.apk
          gh release create "v${{ github.run_number }}" ScrewBot.apk \
            --title "ScrewBot build ${{ github.run_number }}" \
            --notes "APK debug. Unduh ScrewBot.apk lalu pasang di HP."
